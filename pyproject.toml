[project]
name = "nyc-taxi-lakehouse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "pandera[pyspark]>=0.32.1",
    "pendulum>=3.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyspark>=4.2.0",
    "python-dotenv>=1.2.2",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "jupyter>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyc_taxi_lakehouse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
